# Production stack for a single VM behind nginx/Cloudflare (works on arm64 and amd64).
# Everything binds to 127.0.0.1; the reverse proxy is the only public entry point.
#   app 8481, keycloak 8482 (web frontend 8483 is deployed separately)
# Usage: cp .env.example .env, edit it, then: docker compose -f compose.prod.yml --env-file .env up -d --build
name: petstore

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: petstore
      POSTGRES_USER: petstore
      POSTGRES_PASSWORD: ${PETSTORE_DB_PASSWORD:?set PETSTORE_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the keycloak role and database on first start only
      - ./postgres/init-keycloak.sh:/docker-entrypoint-initdb.d/init-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petstore -d petstore"]
      interval: 10s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    command: start --import-realm --http-enabled=true --proxy-headers xforwarded --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Substituted into the realm import (redirect URIs and web origins of the web client)
      PETSTORE_WEB_ORIGIN: ${PETSTORE_WEB_ORIGIN:?set PETSTORE_WEB_ORIGIN}
      PETSTORE_WEB_ORIGIN_ALT: ${PETSTORE_WEB_ORIGIN}
    volumes:
      - ../keycloak/petstore-realm.json:/opt/keycloak/data/import/petstore-realm.json:ro
      # Themes are cached in `start` mode (spi-theme--cache-themes=true): restart keycloak after changing them
      - ../keycloak/themes/petstore:/opt/keycloak/themes/petstore:ro
    ports:
      - "127.0.0.1:8482:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  app:
    build:
      context: ..
    image: petstore:${PETSTORE_VERSION:-latest}
    restart: unless-stopped
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/petstore
      DB_USERNAME: petstore
      DB_PASSWORD: ${PETSTORE_DB_PASSWORD}
      # Shared public demo only: seed demo customers/orders on an empty database (reset-demo.sh restores it)
      PETSTORE_SEED_DEMO: ${PETSTORE_SEED_DEMO:-false}
      PETSTORE_API_DOCS: ${PETSTORE_API_DOCS:-false}
      # Must equal the token issuer, i.e. the public Keycloak URL including /realms/petstore
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?set KEYCLOAK_ISSUER_URI}
      # Keys are fetched inside the compose network, no round trip through Cloudflare
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/petstore/protocol/openid-connect/certs
      PETSTORE_CORS_ORIGINS: ${PETSTORE_WEB_ORIGIN}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - uploads:/app/user-photos
    ports:
      - "127.0.0.1:8481:8081"

volumes:
  pgdata:
  uploads:
