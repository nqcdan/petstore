# Dev only: the admin site's nginx.admin.conf plus the /api proxy that the host nginx provides in production.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  location /api/ {
    proxy_pass http://app:8081;
    proxy_set_header Host $host;
    client_max_body_size 4m;
  }

  location /assets/ {
    include /etc/nginx/admin-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /silent-check-sso.html {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-JXGej4mPACbE/fP5kuunldJEyMk62sNjNe85DtAcMoU='; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache";
  }

  location / {
    include /etc/nginx/admin-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
