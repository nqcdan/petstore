apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm
  labels:
    {{- include "petstore.labels" . | nindent 4 }}
data:
  {{ .Values.keycloak.realm }}-realm.json: |
    {{- .Values.keycloak.realmJson | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "petstore.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "petstore.selector" (dict "root" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/realm: {{ .Values.keycloak.realmJson | sha256sum }}
      labels:
        {{- include "petstore.labels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: [start, --import-realm]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/{{ .Values.keycloak.database }}" }
            - { name: KC_DB_USERNAME, value: {{ .Values.postgres.username | quote }} }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: {{ .Values.keycloak.adminUser | quote }} }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: keycloak-admin-password }
            - { name: KC_HOSTNAME, value: "https://{{ .Values.ingress.authHost }}" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap:
            name: {{ .Release.Name }}-keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "petstore.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "petstore.selector" (dict "root" . "component" "keycloak") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
