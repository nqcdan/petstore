# Security headers of the admin site, included in every location (add_header is not inherited once a location sets its own).
# __KEYCLOAK_ORIGIN__ and __API_ORIGIN__ are filled in at image build from VITE_KEYCLOAK_URL and VITE_API_BASE.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __API_ORIGIN__; font-src 'self' data:; connect-src 'self' __KEYCLOAK_ORIGIN__ __API_ORIGIN__; frame-src __KEYCLOAK_ORIGIN__ 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
