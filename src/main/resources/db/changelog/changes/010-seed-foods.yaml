databaseChangeLog:
  - changeSet:
      id: 010-seed-foods
      author: dan
      changes:
        - loadData:
            tableName: food
            file: db/changelog/data/foods.csv
            relativeToChangelogFile: false
            separator: ","
            quotchar: '"'
            encoding: UTF-8
            columns:
              - column: {name: name, type: STRING}
              - column: {name: sortname, type: STRING}
              - column: {name: price, type: NUMERIC}
              - column: {name: pic, type: STRING}
              - column: {name: description, type: STRING}
              - column: {name: type, type: STRING}
