server.port=${SERVER_PORT:8081}
server.max-http-header-size=16KB
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
spring.application.name=petstore

# Legacy JSP views
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Mail (set MAIL_USERNAME / MAIL_PASSWORD, e.g. a Gmail app password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Database: PostgreSQL everywhere (dev, tests, prod). The defaults match docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/petstore}
spring.datasource.username=${DB_USERNAME:petstore}
spring.datasource.password=${DB_PASSWORD:petstore}
# Column names keep the legacy camelCase style used by the native queries
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Keycloak resource server: the issuer must be reachable when the first token is validated
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/petstore}
# Optional: set SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI to fetch signing keys from an internal URL
# while the public issuer is still validated. Do not define the property here, an empty value breaks the auto-configuration.
spring.security.oauth2.resourceserver.jwt.audiences=${KEYCLOAK_API_CLIENT_ID:petstore-api}
petstore.keycloak.client-id=${KEYCLOAK_API_CLIENT_ID:petstore-api}
petstore.cors.allowed-origins=${PETSTORE_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Demo customers/employees/orders for dev and tests only
petstore.seed.demo=${PETSTORE_SEED_DEMO:true}
spring.data.web.pageable.max-page-size=100
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

# OpenAPI: document the REST API only, not the JSP controllers
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
