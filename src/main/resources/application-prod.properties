# No default password in production
spring.datasource.password=${DB_PASSWORD}
# No demo accounts in production
petstore.seed.demo=${PETSTORE_SEED_DEMO:false}
# Behind the TLS-terminating proxy: trust X-Forwarded-* and keep the legacy JSP session cookie HTTPS-only
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
# OpenAPI document and Swagger UI are off unless PETSTORE_API_DOCS=true
springdoc.api-docs.enabled=${PETSTORE_API_DOCS:false}
springdoc.swagger-ui.enabled=${PETSTORE_API_DOCS:false}
